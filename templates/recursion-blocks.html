<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>递归展开 · 代码切块（模板）</title>
<!--
  ============================================================================
  递归展开 · 代码切块模板 —— 递归的第 5 种画法
  ============================================================================
  一块 = 一次函数调用。纵轴是时间（先发生的在上面），横轴是深度（每深一层
  往右挪 DX）。于是天然分出两个方向：

      进入递归  →  新块接在右下方，蓝色实线箭头
      返回上层  →  矮卡片接在左下方，绿色虚线箭头

  整条轨迹是一条「一路往右下爬、到头折回左下」的蛇形回路。这就是它跟递归树
  的根本区别：递归树画的是结构，切块画的是执行流。

  ── 什么时候用这个，什么时候用递归树 ─────────────────────────────
    栈帧      ← 一个函数只线性调自己，观众只需要知道「现在第几层」
    递归树    ← 要看清分叉结构本身（≤4 层、能一屏放下）
    代码切块  ← 难点是「回到谁 / 参数是谁给的 / 好几层的局部值同时活着」
                或者树太宽太深，压扁了字就看不清
    判别细节见 references/block-tiling.md 与 problem-shapes.md 2.5

  ── 改成别的题，只动这五处 ─────────────────────────────────────
    1. CODE       左侧源码，行号 = 数组下标 + 1
    2. L          行号表；run() 里只准引用 L.xxx，不许写死数字
    3. run()      生成器；每 yield 一次 = 图上多一块 / 高亮动一行
    4. VARS       块底部那 3 个变量名，必须和 b.vars 的键一致
    5. renderHud  右上角常驻小面板；不想要就整个删掉（块作主、状态缩成角标
                  是推荐做法，但状态多的时候要换成右栏罗列）
  INPUT / brute() 照旧，brute 会自动对拍。
  ============================================================================
-->
<style>
  :root{
    --bg:#f4f2ec; --panel:#faf9f6; --line:#e6e2d6;
    --txt:#2f2c26; --txt2:#6b6659; --txt3:#a8a49a;
    --amber:#c07c14; --amber-bg:#fdf3e0;
    --green:#17804a; --green-bg:#e8f5ee;
    --blue:#2f6fd0; --blue-bg:#eaf1fb;
    --mono: ui-monospace, "SF Mono", Consolas, "Cascadia Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--txt); overflow:hidden;
  }
  .app{display:flex;flex-direction:column;height:100%;}

  header{
    display:flex;align-items:center;gap:10px;
    padding:9px 16px;flex-shrink:0;
    background:var(--panel);border-bottom:1px solid var(--line);
  }
  .title{font-size:14.5px;font-weight:600;letter-spacing:.2px;white-space:nowrap;}
  .title small{font-weight:400;color:var(--txt3);margin-left:9px;font-size:11.5px;}
  .spacer{flex:1;}
  .controls{display:flex;align-items:center;gap:6px;}
  button{
    font-family:inherit;font-size:12px;color:var(--txt2);
    background:#fff;border:1px solid var(--line);border-radius:7px;
    padding:5px 11px;cursor:pointer;line-height:1.5;
    transition:background .15s,border-color .15s,color .15s;
  }
  button:hover:not(:disabled){background:#f6f4ee;border-color:#d6d1c1;}
  button:disabled{opacity:.42;cursor:default;}
  button.on{background:var(--amber-bg);border-color:#e0c690;color:#7a4e0c;font-weight:500;}
  .speed{display:flex;gap:0;margin-left:4px;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
  .speed button{border:0;border-radius:0;padding:5px 9px;font-size:11.5px;}
  .speed button+button{border-left:1px solid var(--line);}

  /* ---- 左右分栏 ---- */
  .workspace{flex:1;display:flex;min-height:0;}

  .codepane{
    width:428px;flex-shrink:0;overflow-y:auto;overflow-x:hidden;
    background:#fbfaf7;border-right:1px solid var(--line);
    padding:10px 0 18px;
  }
  .codepane::-webkit-scrollbar{width:7px;}
  .codepane::-webkit-scrollbar-thumb{background:#ddd8c9;border-radius:4px;}
  .clabel{
    display:flex;align-items:center;gap:7px;
    font-size:10.5px;color:var(--txt3);letter-spacing:.5px;
    padding:0 14px 8px;
  }
  .clabel i{width:6px;height:6px;border-radius:50%;background:#c9c4b4;display:block;}

  .ln{
    display:flex;align-items:baseline;
    font-family:var(--mono);font-size:11px;line-height:1.82;
    color:#5c584c;transition:background .12s;
  }
  .ln .no{
    width:34px;text-align:right;padding-right:11px;flex-shrink:0;
    color:#c6c1b3;font-size:10px;user-select:none;
  }
  .ln .tx{white-space:pre;padding-right:10px;}
  .ln.on{background:#fdf1d6;box-shadow:inset 2.5px 0 0 var(--amber);}
  .ln.on .tx{color:#7a4e0c;font-weight:600;}
  .ln.on .no{color:var(--amber);font-weight:600;}
  .ln.g.on{background:#e7f5ec;box-shadow:inset 2.5px 0 0 var(--green);}
  .ln.g.on .tx{color:#0d5c34;}
  .ln.g.on .no{color:var(--green);}

  .legend{
    margin:20px 18px 0;padding-top:13px;
    border-top:1px dashed var(--line);
  }
  .lg{
    font-size:11px;color:var(--txt3);line-height:24px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .lg .sw{
    display:inline-block;vertical-align:middle;
    width:15px;height:10px;border-radius:3px;
    border:1.5px solid #ccc;margin-right:9px;margin-top:-2px;
  }
  .lg .sw.a{border-color:#c07c14;background:#fffcf5;}
  .lg .sw.d{border-color:#a9d3bd;background:#f6fbf8;}
  .lg .sw.r{border-color:#a3cfb9;background:#f0f9f4;border-style:dashed;}
  .lg .sw.blue{border:0;width:22px;height:3px;border-radius:2px;background:#2f6fd0;}
  .lg .sw.grn{
    border:0;width:22px;height:3px;border-radius:0;
    background:repeating-linear-gradient(90deg,#17804a 0 5px,transparent 5px 8px);
  }

  /* ---- 画布 ---- */
  .stage{position:relative;flex:1;min-width:0;overflow:hidden;background:var(--bg);}
  #svg{display:block;width:100%;height:100%;}

  .hud{
    position:absolute;right:16px;top:13px;z-index:2;
    display:flex;flex-direction:column;gap:5px;align-items:flex-end;
    pointer-events:none;
  }
  .hrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
  .hlab{font-size:10.5px;color:var(--txt3);letter-spacing:.4px;}
  .chip{
    font-family:var(--mono);font-size:11px;
    background:rgba(255,255,255,.92);border:1px solid var(--line);
    border-radius:6px;padding:2px 7px;color:var(--txt2);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .chip.ok{background:var(--green-bg);border-color:#bfe3cf;color:#0d5c34;font-weight:600;}
  .chip.path{background:var(--green-bg);border-color:#bfe3cf;color:#0d5c34;}

  .sub{
    display:flex;align-items:center;gap:14px;flex-shrink:0;
    padding:9px 18px;min-height:52px;
    background:var(--panel);border-top:1px solid var(--line);
  }
  .stepinfo{
    font-family:var(--mono);font-size:11.5px;color:var(--txt3);
    white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums;
  }
  .notetext{font-size:12.5px;color:var(--txt2);line-height:1.55;}
  .notetext code{
    font-family:var(--mono);font-size:11.5px;
    background:#efeadc;border-radius:4px;padding:1px 5px;color:#6b4b12;
  }
  .notetext b{color:var(--amber);font-weight:600;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">递归切块演示<small>示例：437 路径总和 III · 一块 = 一次调用</small></div>
    <div class="spacer"></div>
    <div class="controls">
      <button id="btnPrev">上一步</button>
      <button id="btnNext">下一步</button>
      <button id="btnPlay">播放</button>
      <div class="speed">
        <button data-s="1300">慢</button>
        <button data-s="720" class="on">中</button>
        <button data-s="330">快</button>
      </div>
    </div>
  </header>

  <div class="workspace">
    <aside class="codepane" id="codepane"></aside>

    <div class="stage" id="stage">
      <div class="hud" id="hud"></div>
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arr-c" viewBox="0 0 10 10" refX="7.4" refY="5"
                  markerWidth="4.4" markerHeight="4.4" orient="auto">
            <path d="M0 0.8 L8.2 5 L0 9.2 z" fill="#2f6fd0"/>
          </marker>
          <marker id="arr-r" viewBox="0 0 10 10" refX="7.4" refY="5"
                  markerWidth="4.4" markerHeight="4.4" orient="auto">
            <path d="M0 0.8 L8.2 5 L0 9.2 z" fill="#17804a"/>
          </marker>
        </defs>
        <g id="world"></g>
      </svg>
    </div>
  </div>

  <div class="sub">
    <div class="stepinfo" id="stepInfo">第 1 / 1 步</div>
    <div class="notetext" id="note">准备开始</div>
  </div>
</div>

<script>
/* ==TRACE-BEGIN== */
// 只放纯计算：校验脚本会把这一块单独抽出来跑，不许碰 DOM

// 数据入口。多参数题目就把 INPUT 写成对象 { arr: [...], target: 8 }，
// 在 run() 第一行解构 —— 校验脚本固定调 run(INPUT) / brute(INPUT)，不会多传参。
const INPUT = [10, 5, -3, 3, 2];
const TARGET = 8;

// 完整源码，line 就是这里的 1-based 行号
const CODE = [
  'class Solution {',
  'public:',
  '    unordered_map<long long, int> cnt;',
  '    int pathSum(TreeNode* root, int targetSum) {',
  '        cnt[0] = 1;',
  '        return dfs(root, 0, targetSum);',
  '    }',
  '    int dfs(TreeNode* node, long long pre, int targetSum) {',
  '        if (!node) return 0;',
  '        pre += node->val;',
  '        int res = cnt[pre - targetSum];',
  '        cnt[pre]++;',
  '        res += dfs(node->left, pre, targetSum);',
  '        res += dfs(node->right, pre, targetSum);',
  '        cnt[pre]--;',
  '        return res;',
  '    }',
  '};'
];
const L = {
  cntInit: 5, callRoot: 6,
  nullChk: 9, preAdd: 10, lookup: 11, cntAdd: 12,
  left: 13, right: 14, cntSub: 15, ret: 16
};

// 层序数组 -> 节点表（id 是 L/R 路径，根是空串）
function buildTree(arr) {
  const nodes = [];
  if (!arr.length || arr[0] === null || arr[0] === undefined) return nodes;
  const root = { id: '', val: arr[0], parent: null };
  nodes.push(root);
  const q = [root];
  let i = 1;
  while (q.length && i < arr.length) {
    const cur = q.shift();
    for (const side of ['L', 'R']) {
      if (i >= arr.length) break;
      const v = arr[i++];
      if (v === null || v === undefined) continue;
      const n = { id: cur.id + side, val: v, parent: cur.id };
      nodes.push(n);
      q.push(n);
    }
  }
  return nodes;
}

function posOf(id) {
  if (id === '') return '（树根）';
  const dirs = id.split('').map(c => (c === 'L' ? '左' : '右')).join('→');
  return '（根走 ' + dirs + '）';
}

// 生成器：每 yield 一次 = 图上多一块 / 高亮动一步
function* run(input, target) {
  target = (target === undefined ? TARGET : target);
  const nodes = buildTree(input);
  const byId = {}, kids = {};
  nodes.forEach(n => { byId[n.id] = n; kids[n.id] = []; });
  nodes.forEach(n => { if (n.parent !== null) kids[n.parent].push(n.id); });

  let blocks = [];          // 图上的块，按出现顺序
  let active = -1;          // 当前正在执行哪一块
  let cnt = {};             // 前缀和 -> 出现次数
  let found = [];           // 已找到的路径（值数组）
  let total = 0;            // 总条数
  const preStack = [];      // 根 -> 当前 的前缀栈
  let lastLine = 1;

  const snap = (note, extra) => {
    const cur = (active >= 0 && active < blocks.length) ? blocks[active].line : lastLine;
    lastLine = cur;
    return {
      note,
      line: cur,
      ans: total,
      blocks: blocks.map(b => ({ ...b, vars: { ...b.vars } })),
      active,
      cnt: { ...cnt },
      found: found.map(x => x.slice()),
      total,
      ...(extra || {})
    };
  };

  if (!nodes.length) {
    yield snap('空树，0 条路径。', { done: true });
    return;
  }

  cnt = { 0: 1 };
  yield snap('<code>cnt[0] = 1</code>：先把「空路径」记一笔。没有这一格，所有从树根起步的路径都会漏掉。', { line: L.cntInit });

  yield snap('第 6 行把活儿交出去：<code>dfs(root, 0, ' + target + ')</code>，<code>pre</code> 从 0 起步。', { line: L.callRoot });

  function* go(id, preIn, depth) {
    const n = byId[id];
    const me = blocks.length;

    // ---- 接一块：进入这次调用（落在右下方）----
    blocks.push({
      kind: 'call', depth, val: n.val, line: L.nullChk, done: false,
      vars: { pre: preIn, need: null, hit: null, res: null }
    });
    active = me;
    yield snap('新块接在<strong>右下方</strong>：进入 <code>dfs(' + n.val + ')</code>' + posOf(id) +
               '，父亲交下来 <code>pre = ' + preIn + '</code>。');

    yield snap('<code>node</code> 不是空（值为 ' + n.val + '），刹车不踩，往下走。');

    const pre = preIn + n.val;
    blocks[me].vars.pre = pre;
    blocks[me].line = L.preAdd;
    yield snap('<code>pre = ' + preIn + ' + (' + n.val + ') = ' + pre + '</code>，这一层的「根一路走到我」算好了。');

    const need = pre - target;
    const hit = cnt[need] || 0;
    blocks[me].vars.need = need;
    blocks[me].vars.hit = hit;
    blocks[me].line = L.lookup;

    preStack.push({ val: n.val, pre });
    const newPaths = [];
    if (hit > 0) {
      if (need === 0) newPaths.push(preStack.map(x => x.val));
      preStack.forEach((x, i) => {
        if (i < preStack.length - 1 && x.pre === need) newPaths.push(preStack.slice(i + 1).map(y => y.val));
      });
    }
    found.push(...newPaths);
    total += hit;
    yield snap('查表：<code>pre − targetSum = ' + pre + ' − ' + target + ' = ' + need + '</code>，<code>cnt[' + need + '] = ' + hit + '</code>。' +
      (hit ? ' → <b>命中 ' + hit + ' 条</b>：' + newPaths.map(q => q.join('→')).join('、') + '。'
           : ' → 表里没有这个前缀，这一站不给答案。'));

    cnt[pre] = (cnt[pre] || 0) + 1;
    blocks[me].line = L.cntAdd;
    yield snap('<code>cnt[' + pre + ']++</code> → 表里 Σ' + pre + ' 现在出现 ' + cnt[pre] + ' 次。挂上去，只有我下面那棵子树的后代查得到。');

    let sub = hit;
    const lc = (kids[id] || []).find(c => c.slice(-1) === 'L');
    const rc = (kids[id] || []).find(c => c.slice(-1) === 'R');

    if (lc) {
      blocks[me].line = L.left;
      yield snap('往<strong>右下方</strong>再接一块：<code>dfs(' + byId[lc].val + ')</code>，把 <code>pre = ' + pre + '</code> 带下去。');
      sub += yield* go(lc, pre, depth + 1);
      active = me;
    }
    if (rc) {
      blocks[me].line = L.right;
      yield snap('左孩子回来了（目前累计 ' + sub + '），再往<strong>右下方</strong>接一块：<code>dfs(' + byId[rc].val + ')</code>。');
      sub += yield* go(rc, pre, depth + 1);
      active = me;
    }
    if (!lc && !rc) {
      blocks[me].line = L.left;
      yield snap(n.val + ' 是叶子，左右都空，两次 <code>dfs(nullptr)</code> 各返回 0，<code>res</code> 一条也不加。');
    }

    preStack.pop();
    cnt[pre]--;
    const left = cnt[pre] || 0;
    if (left <= 0 && pre !== 0) delete cnt[pre];
    blocks[me].line = L.cntSub;
    yield snap('要走了：<code>cnt[' + pre + ']--</code> → ' + left + '。' +
      (left ? '表里还留着（有别的祖先同一个前缀）。' : '这一格从表里撤掉。') +
      ' 不撤的话，兄弟子树会把我当祖先，答案就多算了。');

    blocks[me].line = L.ret;
    blocks[me].vars.res = sub;
    blocks[me].done = true;
    active = me;
    yield snap('这一块算完了，<code>res = ' + sub + '</code>（自己命中 ' + hit + ' ＋ 子树 ' + (sub - hit) + '）。');

    if (depth > 0) {
      blocks.push({ kind: 'ret', depth: depth - 1, val: n.val, res: sub, line: L.ret, vars: { res: sub } });
      active = blocks.length - 1;
      yield snap('新块接在<strong>左下方</strong>：<code>' + sub + '</code> 个答案交回上一层。整棵树的累计已经 ' + total + ' 条。');
    }
    return sub;
  }

  yield* go('', 0, 0);
  active = blocks.length - 1;
  yield snap('全部展开完，<code>pathSum</code> 返回 <b>' + total + '</b> 条' +
    (found.length ? '：' + found.map(q => q.join('→')).join('、') : '') +
    '。每个节点只进一次、出一次，时间 O(n)。', { done: true });
}

// 暴力解：每个节点当起点、只往下走，用来对拍
function brute(input, target) {
  target = (target === undefined ? TARGET : target);
  const nodes = buildTree(input);
  if (!nodes.length) return 0;
  const byId = {}, kids = {};
  nodes.forEach(n => { byId[n.id] = n; kids[n.id] = []; });
  nodes.forEach(n => { if (n.parent !== null) kids[n.parent].push(n.id); });
  let ans = 0;
  const walk = (id, sum) => {
    sum += byId[id].val;
    if (sum === target) ans++;
    (kids[id] || []).forEach(c => walk(c, sum));
  };
  nodes.forEach(n => walk(n.id, 0));
  return ans;
}
/* ==TRACE-END== */

/* ---------- 布局常量 ---------- */
const BW = 176;      // 块宽
const BH = 56;       // 调用块高
const RH = 30;       // 返回块高
const DX = 190;      // 每深一层往右挪多少
const GAP = 16;      // 块与块的纵向间距

// 块底部最多 3 个变量：[键名, 标签左边距, 标签到数值的间距]
// 键名必须和 run() 里写的 b.vars 对上；间距按标签字符数手调——
// need 比 pre 宽，统一偏移会叠字（SVG 文本不会自动避让）
const VARS = [['pre', 12, 19], ['need', 50, 24], ['hit', 92, 19]];

const steps = [...run(INPUT)];

const stage = document.getElementById('stage');
const world = document.getElementById('world');
const codePane = document.getElementById('codepane');

let idx = 0;
let timer = null;
let speed = 720;

/* ---------- 左侧完整代码 ---------- */
let codeEls = [];
function esc(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function buildCode() {
  codePane.innerHTML =
    '<div class="clabel"><i></i>Solution.cpp</div>' +
    CODE.map((t, i) =>
      '<div class="ln" data-line="' + (i + 1) + '">' +
      '<span class="no">' + (i + 1) + '</span>' +
      '<span class="tx">' + esc(t) + '</span></div>'
    ).join('') +
    '<div class="legend">' +
      '<div class="lg"><span class="sw a"></span>正在处理这一块</div>' +
      '<div class="lg"><span class="sw d"></span>已经算完的块</div>' +
      '<div class="lg"><span class="sw r"></span>返回上一层的小卡</div>' +
      '<div class="lg"><span class="sw blue"></span>进入下一层（右下方）</div>' +
      '<div class="lg"><span class="sw grn"></span>交回上一层（左下方）</div>' +
    '</div>';
  codeEls = [...codePane.querySelectorAll('.ln')];
}

/* ---------- 相机 ---------- */
const cam = { x: 0, y: 0, z: 1 };
const tgt = { x: 0, y: 0, z: 1 };
let camReady = false;

function applyCam() {
  world.setAttribute('transform',
    'translate(' + cam.x.toFixed(2) + ',' + cam.y.toFixed(2) + ') scale(' + cam.z.toFixed(4) + ')');
}
function loop() {
  const k = 0.2;
  cam.x += (tgt.x - cam.x) * k;
  cam.y += (tgt.y - cam.y) * k;
  cam.z += (tgt.z - cam.z) * k;
  applyCam();
  requestAnimationFrame(loop);
}
function fitAll(blocks) {
  const cw = stage.clientWidth, ch = stage.clientHeight;
  const maxX = Math.max(...blocks.map(b => b.x + BW));
  const maxY = Math.max(...blocks.map(b => b.y + b.h));
  const z = Math.min(cw / (maxX + 90), ch / (maxY + 70), 1.34);
  tgt.z = z;
  tgt.x = (cw - maxX * z) / 2;
  tgt.y = (ch - maxY * z) / 2;
}

/* ---------- 画图 ---------- */
function layout(blocks) {
  let y = 0;
  blocks.forEach(b => {
    b.h = b.kind === 'ret' ? RH : BH;
    b.x = (b.depth || 0) * DX;
    b.y = y;
    y += b.h + GAP;
  });
  return y;
}

function drawBlocks(s) {
  const blocks = s.blocks;
  if (!blocks.length) {
    world.innerHTML = '<text x="0" y="0" text-anchor="middle" font-size="13" ' +
      'font-family="-apple-system, Microsoft YaHei, sans-serif" fill="#b3ae9f">准备开始 —— 下一块就是 dfs(根)</text>';
    return { empty: true };
  }
  layout(blocks);

  const ai = (s.active >= 0 && s.active < blocks.length) ? s.active : blocks.length - 1;
  let h = '';

  // 连线：短，只负责指方向
  for (let i = 0; i + 1 < blocks.length; i++) {
    const a = blocks[i], b = blocks[i + 1];
    const x1 = a.x + BW / 2, y1 = a.y + a.h + 1.5;
    const x2 = b.x + BW / 2, y2 = b.y - 5;
    const isRet = b.kind === 'ret';
    const col = isRet ? '#17804a' : '#2f6fd0';
    const dash = isRet ? ' stroke-dasharray="5 3.5"' : '';
    const mid = (y1 + y2) / 2;
    h += '<path d="M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + mid + ' ' + x2 + ' ' + mid + ' ' + x2 + ' ' + y2 +
         '" fill="none" stroke="' + col + '" stroke-width="1.5" opacity=".7"' + dash +
         ' marker-end="url(#' + (isRet ? 'arr-r' : 'arr-c') + ')"/>';
  }

  blocks.forEach((b, i) => {
    const act = i === ai;

    if (b.kind === 'ret') {
      h += '<rect x="' + b.x + '" y="' + b.y + '" width="' + BW + '" height="' + b.h +
           '" rx="8" fill="#f0f9f4" stroke="' + (act ? '#17804a' : '#a3cfb9') + '" stroke-width="' +
           (act ? 1.9 : 1.3) + '" stroke-dasharray="5 3"/>';
      h += '<text x="' + (b.x + 12) + '" y="' + (b.y + 20) + '" font-size="10.5" font-family="' +
           'ui-monospace, Consolas, monospace" fill="#0d5c34">↩ dfs(' + b.val + ')</text>';
      h += '<text x="' + (b.x + BW - 12) + '" y="' + (b.y + 20) +
           '" text-anchor="end" font-size="11" font-weight="600" font-family="' +
           'ui-monospace, Consolas, monospace" fill="#0d5c34">res ' + b.res + '</text>';
      return;
    }

    let fill = '#ffffff', stroke = '#d8d3c4', sw = 1.3, txt = '#4a463b';
    if (act) { fill = '#fffcf5'; stroke = '#c07c14'; sw = 2; txt = '#7a4e0c'; }
    else if (b.done) { fill = '#f6fbf8'; stroke = '#a9d3bd'; sw = 1.4; txt = '#3f5c4c'; }

    h += '<rect x="' + b.x + '" y="' + b.y + '" width="' + BW + '" height="' + b.h +
         '" rx="9" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
    h += '<line x1="' + (b.x + 1) + '" y1="' + (b.y + 23) + '" x2="' + (b.x + BW - 1) + '" y2="' + (b.y + 23) +
         '" stroke="' + (act ? '#ecd9b0' : '#eee9dc') + '"/>';

    // 标题
    h += '<circle cx="' + (b.x + 12) + '" cy="' + (b.y + 12) + '" r="2.8" fill="' +
         (act ? '#c07c14' : (b.done ? '#8ec7a9' : '#cfc9b8')) + '"/>';
    h += '<text x="' + (b.x + 21) + '" y="' + (b.y + 16) + '" font-size="11" font-weight="600" font-family="' +
         'ui-monospace, Consolas, monospace" fill="' + txt + '">dfs(' + b.val + ')</text>';

    // 算完了就在右上角贴返回值
    if (b.vars.res !== null && b.vars.res !== undefined) {
      h += '<text x="' + (b.x + BW - 11) + '" y="' + (b.y + 16) +
           '" text-anchor="end" font-size="10.5" font-weight="600" font-family="' +
           'ui-monospace, Consolas, monospace" fill="#0d5c34">↩ ' + b.vars.res + '</text>';
    }

    // 变量
    const items = VARS;
    items.forEach(it => {
      const va = b.vars[it[0]];
      const has = va !== null && va !== undefined;
      h += '<text x="' + (b.x + it[1]) + '" y="' + (b.y + 41) + '" font-size="8.5" font-family="' +
           'ui-monospace, Consolas, monospace" fill="#b8b3a4">' + it[0] + '</text>';
      h += '<text x="' + (b.x + it[1] + it[2]) + '" y="' + (b.y + 41) + '" font-size="10.5" font-weight="' +
           (has ? 600 : 400) + '" font-family="ui-monospace, Consolas, monospace" fill="' +
           (has ? txt : '#d5d0c3') + '">' + (has ? va : '–') + '</text>';
    });
  });

  world.innerHTML = h;
  return { blocks, ai };
}

/* ---------- HUD：右上角常驻小面板（状态缩成角标） ---------- */
function renderHud(s) {
  const keys = Object.keys(s.cnt).map(Number).sort((a, b) => a - b);
  let h = '<div class="hrow"><span class="hlab">cnt</span>';
  keys.forEach(k => { h += '<span class="chip">Σ' + k + ' ×' + s.cnt[k] + '</span>'; });
  h += '</div>';
  h += '<div class="hrow"><span class="hlab">已找到</span><span class="chip ok">' + s.found.length + ' 条</span>';
  s.found.forEach(q => { h += '<span class="chip path">' + q.join('→') + '</span>'; });
  h += '</div>';
  document.getElementById('hud').innerHTML = h;
}

/* ---------- 渲染 ---------- */
function render(immediate) {
  const s = steps[idx];
  const r = drawBlocks(s);

  if (r && r.empty) {
    tgt.z = 1;
    tgt.x = stage.clientWidth / 2;
    tgt.y = stage.clientHeight / 2;
  } else if (r) {
    fitAll(r.blocks);
  }
  if (immediate || !camReady) {
    cam.x = tgt.x; cam.y = tgt.y; cam.z = tgt.z; applyCam(); camReady = true;
  }

  codeEls.forEach(el => el.classList.toggle('on', Number(el.dataset.line) === s.line));
  const cur = codeEls.find(el => el.classList.contains('on'));
  if (cur) {
    const box = codePane.getBoundingClientRect();
    const rc = cur.getBoundingClientRect();
    if (rc.top < box.top + 4 || rc.bottom > box.bottom - 4) cur.scrollIntoView({ block: 'center' });
  }

  renderHud(s);
  document.getElementById('note').innerHTML = s.note;
  document.getElementById('stepInfo').textContent = '第 ' + (idx + 1) + ' / ' + steps.length + ' 步';
  document.getElementById('btnPrev').disabled = idx === 0;
  document.getElementById('btnNext').disabled = idx === steps.length - 1;
}

/* ---------- 控制 ---------- */
function stop() {
  if (timer) { clearInterval(timer); timer = null; }
  document.getElementById('btnPlay').textContent = '播放';
  document.getElementById('btnPlay').classList.remove('on');
}
function play() {
  if (timer) { stop(); return; }
  if (idx >= steps.length - 1) { idx = 0; render(); }
  document.getElementById('btnPlay').textContent = '暂停';
  document.getElementById('btnPlay').classList.add('on');
  timer = setInterval(() => {
    if (idx >= steps.length - 1) { stop(); return; }
    idx++; render();
  }, speed);
}
function go(d) {
  stop();
  idx = Math.max(0, Math.min(steps.length - 1, idx + d));
  render();
}

document.getElementById('btnPrev').onclick = () => go(-1);
document.getElementById('btnNext').onclick = () => go(1);
document.getElementById('btnPlay').onclick = play;
document.querySelectorAll('.speed button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.speed button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    speed = Number(b.dataset.s);
    if (timer) { stop(); play(); }
  };
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  else if (e.key === ' ') { e.preventDefault(); play(); }
});

window.addEventListener('resize', () => { camReady = false; render(true); });

/* ---------- 起步 ---------- */
buildCode();
const hm = location.hash.match(/step=(\d+)/);
if (hm) idx = Math.max(0, Math.min(Number(hm[1]), steps.length - 1));
render(true);
loop();
</script>
